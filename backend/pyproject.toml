[project]
name = "shopping-agent-api"
version = "0.1.0"
description = "Local API and persistent task service for Shopping Agent"
requires-python = ">=3.10,<3.14"
dependencies = [
  "alembic>=1.20,<2",
  "fastapi>=0.125,<1",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "platformdirs>=4.5,<5",
  "playwright>=1.58,<2",
  "psutil>=7,<9",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.45,<3",
  "uvicorn[standard]>=0.38,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.14,<1",
]
agent-probe = [
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
